name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de lógica y contenido
        run: npm test
      - name: Instalar navegador para la prueba completa
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prueba completa en navegador
        run: npm run e2e
