<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madriguera · Inglés con roedores</title>
<meta name="description" content="Aprende inglés cuidando roedores: repaso espaciado, voz y mascotas que desbloqueas.">
<meta name="theme-color" content="#24170f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="stat" title="Racha de días">🔥 <b id="streak">0</b></div>
    <div class="stat" title="Semillas">🌰 <b id="seeds">0</b></div>
    <div class="stat lvl"><span class="lv" id="lvl">Nv 1</span><div class="bar"><i id="xpbar"></i></div></div>
  </header>

  <!-- ===== CASA ===== -->
  <section id="view-home" class="view">
    <div class="room" id="room">
      <div class="wall"></div>
      <div class="win" id="win"><i></i></div>
      <div class="slot slot-wall" id="slot-wall"></div>
      <div class="slot slot-hang" id="slot-hang"></div>
      <div class="floor"></div>
      <div class="slot slot-rug" id="slot-rug"></div>
      <div class="slot slot-left" id="slot-left"></div>
      <div class="slot slot-right" id="slot-right"></div>
      <div class="bubble" id="bubble"></div>
      <div class="petwrap" id="petwrap" data-state="idle"></div>
      <div class="fx" id="fx"></div>
    </div>
    <div class="panel">
      <div class="petname"><h2 id="petname"></h2><span id="petsp"></span></div>
      <div class="meter"><label>Panza</label><div class="bar"><i id="fullbar"></i></div><span id="fullpct"></span></div>
      <p class="mood" id="mood"></p>
      <div class="actions">
        <button id="btnFeed">🌰 Alimentar</button>
        <button id="btnPet">🤍 Acariciar</button>
        <button id="btnWord">🔊 Palabra</button>
      </div>
      <button class="cta" id="btnStudy">Estudiar</button>
      <div class="goal"><span>Meta de hoy</span><span id="goalTxt"></span></div>
    </div>
  </section>

  <!-- ===== UNIDADES ===== -->
  <section id="view-units" class="view hidden">
    <div class="list">
      <h1>Lecciones · Nivel A1</h1>
      <div id="units"></div>
    </div>
  </section>

  <!-- ===== LECCIÓN ===== -->
  <section id="view-lesson" class="view hidden">
    <div class="lhead">
      <button id="btnQuit" title="Salir (Esc)">✕</button>
      <div class="bar"><i id="lprog" style="width:0"></i></div>
      <span id="lcount"></span>
    </div>
    <div class="ex" id="ex"></div>
    <div class="fb" id="fb">
      <b id="fbTitle"></b><p id="fbText"></p>
      <button id="btnNext">Continuar</button>
    </div>
  </section>

  <!-- ===== ROEDORES ===== -->
  <section id="view-pets" class="view hidden">
    <div class="list"><h1>Tus roedores</h1></div>
    <div class="petlist" id="pets"></div>
  </section>

  <!-- ===== TIENDA ===== -->
  <section id="view-shop" class="view hidden">
    <div class="list">
      <div class="shophead"><h1>Tienda</h1><span class="stat">🌰 <b id="shopSeeds">0</b></span></div>
      <p class="note">Gana semillas estudiando: 1 por acierto, +5 por sesión perfecta y +5 al cumplir la meta del día.</p>
      <div id="shop"></div>
    </div>
  </section>

  <!-- ===== PERFIL ===== -->
  <section id="view-settings" class="view hidden">
    <div class="list">
      <h1>Tu progreso</h1>
      <div id="stats"></div>
      <h3>Voz</h3>
      <label class="field">Voz en inglés<select id="voice"></select></label>
      <label class="field">Velocidad <span id="rateVal"></span><input type="range" id="rate" min="0.5" max="1.2" step="0.05"></label>
      <h3>Respaldo</h3>
      <p class="note">El progreso se guarda solo en este dispositivo. Descarga un respaldo para pasarlo a otro.</p>
      <div class="actions">
        <button id="btnExport">⬇️ Descargar</button>
        <button id="btnImport">⬆️ Restaurar</button>
      </div>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
      <p class="note"><button class="reset" id="btnReset">Reiniciar todo</button></p>
    </div>
  </section>

  <nav>
    <button data-v="home" class="on"><span>🏠</span>Casa</button>
    <button data-v="units"><span>📚</span>Lecciones</button>
    <button data-v="pets"><span>🐀</span>Roedores</button>
    <button data-v="shop"><span>🛍️</span>Tienda</button>
    <button data-v="settings"><span>📈</span>Progreso</button>
  </nav>
  <div class="toast" id="toast"></div>
</div>
</body>
</html>
