<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madriguera · Inglés con roedores</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   MADRIGUERA — prototipo jugable (un solo archivo, sin dependencias)
   Edita libremente: todo el contenido está en la sección DATOS del JS.
   ===================================================================== */
:root{
  --bg:#24170f; --paper:#fff6e8; --paper2:#ffe8c7; --card:#fffdf8;
  --ink:#3a271b; --ink2:#8a6f5c; --line:#ead9c2;
  --moss:#6f9a52; --moss2:#51783a; --terra:#e3794a; --terra2:#c25a30;
  --gold:#f4b63b; --pink:#f3a7b8; --sky:#a7d6ea;
  --ok:#5aa364; --okbg:#e3f3e4; --bad:#d8534e; --badbg:#fbe4e2;
  --r:20px; --shadow:0 10px 30px rgba(58,39,27,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:var(--bg);
  background-image:radial-gradient(circle at 20% 10%,#3a2718 0,transparent 45%),radial-gradient(circle at 80% 90%,#3d2a1c 0,transparent 40%);
  display:flex;justify-content:center;min-height:100vh;
}
#app{
  width:100%;max-width:440px;min-height:100vh;background:var(--paper);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@media(min-width:520px){
  body{padding:24px 0}
  #app{min-height:calc(100vh - 48px);max-height:900px;border-radius:34px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 8px #3a2718}
}
h1,h2,h3,.disp{font-family:'Baloo 2',cursive;letter-spacing:.2px}
button{font-family:inherit;font-weight:800;border:0;cursor:pointer;border-radius:14px;transition:transform .08s,filter .15s}
button:active{transform:translateY(2px) scale(.98)}
button:disabled{opacity:.5;cursor:default}
.hidden{display:none!important}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;}
.stat{display:flex;align-items:center;gap:5px;background:var(--card);border:2px solid var(--line);padding:5px 10px;border-radius:999px;font-weight:800;font-size:14px}
.stat.lvl{margin-left:auto;gap:8px;padding-right:12px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--terra));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stat.lvl .bar{width:70px}
.stat.lvl .lv{color:var(--terra2);font-family:'Baloo 2';font-size:14px}

/* ---------- vistas ---------- */
.view{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:84px;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- navegación ---------- */
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding:8px 10px 12px}
nav button{flex:1;background:transparent;color:var(--ink2);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--terra2);background:var(--paper2)}

/* ---------- el cuarto ---------- */
.room{position:relative;height:300px;margin:6px 14px 0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:#f6d9b0}
.wall{position:absolute;inset:0 0 28% 0;
  background:
    radial-gradient(circle at 10px 10px,rgba(255,255,255,.35) 2px,transparent 3px) 0 0/26px 26px,
    linear-gradient(180deg,#f8e2bf,#f1cf9f)}
.floor{position:absolute;left:0;right:0;bottom:0;height:28%;
  background:repeating-linear-gradient(90deg,#b67a4b 0 38px,#a86d41 38px 40px);
  box-shadow:inset 0 10px 14px rgba(0,0,0,.18)}
.floor:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:#8e5a35}
.win{position:absolute;top:26px;left:26px;width:96px;height:96px;border-radius:50%;border:8px solid #9c6a44;overflow:hidden;background:linear-gradient(180deg,#a7d6ea,#dff0f7);box-shadow:0 6px 0 #7f5435}
.win.night{background:linear-gradient(180deg,#1f2a52,#3b4a7a)}
.win i{position:absolute;width:30px;height:30px;border-radius:50%;background:#ffd35a;top:20px;right:18px;box-shadow:0 0 20px #ffd35a}
.win.night i{background:#fff4c2;box-shadow:0 0 14px #fff4c2}
.win:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;background:#9c6a44;transform:translateX(-50%)}
.shelf{position:absolute;right:24px;top:60px;width:110px;height:8px;background:#9c6a44;border-radius:3px;box-shadow:0 4px 0 #7f5435}
.shelf b{position:absolute;bottom:8px;width:16px;border-radius:3px 3px 0 0}
.shelf b:nth-child(1){left:8px;height:30px;background:#6f9a52}
.shelf b:nth-child(2){left:26px;height:36px;background:#e3794a}
.shelf b:nth-child(3){left:44px;height:26px;background:#f4b63b}
.shelf b:nth-child(4){left:70px;height:22px;width:26px;background:#d9b48a;border-radius:4px}
.wheel{position:absolute;right:30px;bottom:26%;width:78px;height:78px;border-radius:50%;border:7px solid #c9c0b4;
  background:repeating-conic-gradient(#c9c0b4 0 4deg,transparent 4deg 45deg);
  box-shadow:0 0 0 4px #9c6a44 inset;opacity:.9}
.wheel.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.petwrap{position:absolute;left:50%;bottom:14%;width:170px;height:170px;transform:translateX(-56%);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.petwrap svg{width:100%;height:100%;overflow:visible}
.bubble{position:absolute;left:50%;top:18px;transform:translateX(-50%) scale(.6);opacity:0;background:#fff;padding:8px 14px;border-radius:16px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap;transition:all .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
.bubble small{display:block;font-weight:600;color:var(--ink2);font-size:12px}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx span{position:absolute;font-size:22px;animation:float 1.4s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.seedfly{position:absolute;font-size:26px;animation:seed .9s ease-in forwards}
@keyframes seed{0%{transform:translate(0,0) scale(1)}70%{transform:translate(var(--dx),var(--dy)) scale(.9)}100%{transform:translate(var(--dx),var(--dy)) scale(0)}}

/* ---------- animaciones de la mascota ---------- */
.pet .body,.pet .head,.pet .eye,.pet .tail,.pet .earL,.pet .earR{transform-box:fill-box;transform-origin:center}
.pet .head{transform-origin:50% 90%}
.pet .eyes-closed{display:none}
.pet .eye{animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
[data-state=idle] .pet .body{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
[data-state=idle] .pet .tail{animation:wag 3s ease-in-out infinite;transform-origin:0% 100%}
@keyframes wag{50%{transform:rotate(10deg)}}
[data-state=sleepy] .pet .eyes{display:none}
[data-state=sleepy] .pet .eyes-closed{display:block}
[data-state=sleepy] .pet .body{animation:bob 4.5s ease-in-out infinite}
[data-state=sleepy] .pet .head{transform:rotate(-6deg)}
[data-state=happy] .pet .body{animation:hop .45s ease-in-out 4}
@keyframes hop{50%{transform:translateY(-22px)}}
[data-state=happy] .pet .earL{animation:flapL .45s ease-in-out 4}
[data-state=happy] .pet .earR{animation:flapR .45s ease-in-out 4}
@keyframes flapL{50%{transform:rotate(-14deg)}}
@keyframes flapR{50%{transform:rotate(14deg)}}
[data-state=eat] .pet .head{animation:chew .22s ease-in-out 8}
@keyframes chew{50%{transform:scale(1.04,.94)}}
[data-state=eat] .pet .body{animation:none}

/* ---------- panel de casa ---------- */
.panel{padding:14px 18px 0}
.petname{display:flex;align-items:baseline;gap:10px}
.petname h2{font-size:28px;line-height:1}
.petname span{color:var(--ink2);font-weight:700;font-size:13px}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;font-weight:800;color:var(--ink2)}
.meter .bar{flex:1}
.meter .bar i{background:linear-gradient(90deg,var(--moss),#9bc46a)}
.mood{margin-top:10px;font-weight:700;color:var(--ink2);min-height:22px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1;background:var(--card);border:2px solid var(--line);color:var(--ink);padding:12px 4px;font-size:14px;box-shadow:0 3px 0 var(--line)}
.actions button:active{box-shadow:none}
.cta{width:100%;margin-top:12px;background:var(--moss);color:#fff;padding:16px;font-size:18px;font-family:'Baloo 2';box-shadow:0 5px 0 var(--moss2)}
.cta.warm{background:var(--terra);box-shadow:0 5px 0 var(--terra2)}
.cta:active{box-shadow:none}
.goal{margin-top:10px;font-size:12px;color:var(--ink2);font-weight:700;display:flex;justify-content:space-between}

/* ---------- unidades ---------- */
.list{padding:8px 16px}
.list h1{font-size:26px;padding:6px 2px 10px}
.unit{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.unit.locked{opacity:.55}
.unit .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--paper2)}
.unit .t{flex:1}
.unit .t b{font-family:'Baloo 2';font-size:18px;display:block}
.unit .t small{color:var(--ink2);font-weight:700}
.unit .bar{margin-top:6px;height:7px}
.unit .bar i{background:var(--moss)}
.unit button{background:var(--moss);color:#fff;padding:10px 14px;box-shadow:0 3px 0 var(--moss2)}
.unit.locked button{background:var(--line);color:var(--ink2);box-shadow:none}

/* ---------- lección ---------- */
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.lhead button{background:transparent;font-size:20px;color:var(--ink2);padding:4px 8px}
.lhead .bar{flex:1;height:12px}
.lhead .bar i{background:var(--moss)}
.ex{flex:1;padding:14px 18px;display:flex;flex-direction:column}
.ex .q{font-weight:800;color:var(--ink2);font-size:14px;letter-spacing:.3px;text-transform:uppercase}
.ex .big{font-family:'Baloo 2';font-size:40px;line-height:1.1;margin:10px 0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ex .sent{font-family:'Baloo 2';font-size:26px;line-height:1.3;margin:10px 0 18px}
.ex .sent u{text-decoration:none;border-bottom:4px solid var(--terra);padding:0 6px;color:var(--terra2);min-width:60px;display:inline-block;text-align:center}
.spk{background:var(--sky);color:var(--ink);border-radius:50%;width:48px;height:48px;font-size:22px;box-shadow:0 4px 0 #7fb7cf}
.spk.xl{width:120px;height:120px;font-size:54px;margin:14px auto 22px;display:block}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);color:var(--ink);padding:16px;font-size:18px;font-weight:800;text-align:left;box-shadow:0 4px 0 var(--line);border-radius:16px}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{opacity:1}
.inp{width:100%;font:inherit;font-size:22px;font-weight:800;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);outline:0}
.inp:focus{border-color:var(--moss)}
.check{margin-top:12px;background:var(--moss);color:#fff;padding:16px;font-size:18px;box-shadow:0 5px 0 var(--moss2)}
.pethint{margin-top:auto;display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px;font-weight:700;padding-top:14px}
.pethint svg{width:46px;height:46px;overflow:visible}

/* ---------- hoja de retroalimentación ---------- */
.fb{position:absolute;left:0;right:0;bottom:0;transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:18px 18px 22px;border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.fb.show{transform:none}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb b{font-family:'Baloo 2';font-size:22px;display:block}
.fb.ok b{color:#2f6f3a}.fb.bad b{color:#9b2f2b}
.fb p{margin-top:4px;font-weight:700;color:var(--ink)}
.fb button{width:100%;margin-top:14px;padding:16px;font-size:18px;color:#fff}
.fb.ok button{background:var(--ok);box-shadow:0 5px 0 #3f7f49}
.fb.bad button{background:var(--bad);box-shadow:0 5px 0 #a33a36}

/* ---------- fin de sesión ---------- */
.done{text-align:center;padding:20px 10px}
.done h2{font-size:30px}
.done .pet-big{width:160px;height:160px;margin:10px auto}
.done .pet-big svg{width:100%;height:100%;overflow:visible}
.rew{display:flex;justify-content:center;gap:10px;margin:14px 0}
.rew div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:800}
.rew div b{display:block;font-family:'Baloo 2';font-size:24px;color:var(--terra2)}

/* ---------- colección ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;box-shadow:var(--shadow)}
.pcard.locked svg{filter:grayscale(1) contrast(.3) brightness(1.4)}
.pcard svg{width:110px;height:110px;overflow:visible}
.pcard b{display:block;font-family:'Baloo 2';font-size:18px}
.pcard small{display:block;color:var(--ink2);font-weight:700;font-size:12px;min-height:30px}
.pcard button{margin-top:8px;width:100%;padding:9px;background:var(--moss);color:#fff;box-shadow:0 3px 0 var(--moss2)}
.pcard button.sel{background:var(--paper2);color:var(--ink2);box-shadow:none}
.pcard.locked button{background:var(--line);color:var(--ink2);box-shadow:none}
.note{padding:14px 18px;color:var(--ink2);font-size:12px;font-weight:700;line-height:1.5}
.note a{color:var(--terra2)}
.reset{background:transparent;color:var(--ink2);text-decoration:underline;font-size:12px;font-weight:700}

/* ---------- toast ---------- */
.toast{position:absolute;top:70px;left:50%;transform:translate(-50%,-30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;opacity:0;transition:all .3s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="stat" title="Racha de días">🔥 <b id="streak">0</b></div>
    <div class="stat" title="Semillas">🌰 <b id="seeds">0</b></div>
    <div class="stat lvl"><span class="lv" id="lvl">Nv 1</span><div class="bar"><i id="xpbar"></i></div></div>
  </header>

  <!-- ===== CASA ===== -->
  <section id="view-home" class="view">
    <div class="room">
      <div class="wall"></div>
      <div class="win" id="win"><i></i></div>
      <div class="shelf"><b></b><b></b><b></b><b></b></div>
      <div class="wheel" id="wheel"></div>
      <div class="floor"></div>
      <div class="bubble" id="bubble"></div>
      <div class="petwrap" id="petwrap" data-state="idle"></div>
      <div class="fx" id="fx"></div>
    </div>
    <div class="panel">
      <div class="petname"><h2 id="petname"></h2><span id="petsp"></span></div>
      <div class="meter"><label>Panza</label><div class="bar"><i id="fullbar"></i></div><span id="fullpct"></span></div>
      <p class="mood" id="mood"></p>
      <div class="actions">
        <button id="btnFeed">🌰 Alimentar</button>
        <button id="btnPet">🤍 Acariciar</button>
        <button id="btnWord">🔊 Palabra</button>
      </div>
      <button class="cta" id="btnStudy">Estudiar</button>
      <div class="goal"><span>Meta de hoy</span><span id="goalTxt"></span></div>
    </div>
  </section>

  <!-- ===== UNIDADES ===== -->
  <section id="view-units" class="view hidden">
    <div class="list">
      <h1>Lecciones · Nivel A1</h1>
      <div id="units"></div>
    </div>
  </section>

  <!-- ===== LECCIÓN ===== -->
  <section id="view-lesson" class="view hidden">
    <div class="lhead">
      <button id="btnQuit" title="Salir">✕</button>
      <div class="bar"><i id="lprog" style="width:0"></i></div>
      <span id="lcount" style="font-weight:800;color:var(--ink2)"></span>
    </div>
    <div class="ex" id="ex"></div>
    <div class="fb" id="fb">
      <b id="fbTitle"></b><p id="fbText"></p>
      <button id="btnNext">Continuar</button>
    </div>
  </section>

  <!-- ===== ROEDORES ===== -->
  <section id="view-pets" class="view hidden">
    <div class="list"><h1>Tus roedores</h1></div>
    <div class="grid" id="pets"></div>
    <p class="note">Prototipo · progreso guardado en este navegador. Repetición espaciada simplificada (cámbiala por FSRS en la versión real). <button class="reset" id="btnReset">Reiniciar todo</button></p>
  </section>

  <nav>
    <button data-v="home" class="on"><span>🏠</span>Casa</button>
    <button data-v="units"><span>📚</span>Lecciones</button>
    <button data-v="pets"><span>🐭</span>Roedores</button>
  </nav>
  <div class="toast" id="toast"></div>
</div>

const CFG = { sessionSize:10, newPerSession:4, dailyGoal:30, xpCorrect:10, seedCorrect:1, perfectBonus:5, feedCost:1, feedAmount:25, decayPerHour:4, unlockUnitAt:8 };

/* =====================================================================
   ESTADO + persistencia (localStorage, con try/catch por si no existe)
   ===================================================================== */
const KEY='madriguera.v1';
const todayKey=()=>new Date().toISOString().slice(0,10);
const yesterdayKey=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)};

let S = {
  xp:0, seeds:3, streak:0, lastGoalDay:null, todayXP:0, todayKey:todayKey(),
  pet:'mouse', fullness:60, fullTs:Date.now(), unlocked:['mouse'],
  cards:{}  // clave "unit:en" -> {reps, interval, ease, due, seen}
};
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ S={...S,...JSON.parse(raw)}; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

function allCards(){ const out=[]; UNITS.forEach(u=>u.words.forEach(w=>out.push({...w,unit:u.id,key:u.id+':'+w.en}))); return out; }
function card(key){ return S.cards[key] || (S.cards[key]={reps:0,interval:0,ease:2.5,due:0,seen:false}); }
function isLearned(key){ return (S.cards[key]?.interval||0)>=1; }
function unitProgress(u){ return u.words.filter(w=>isLearned(u.id+':'+w.en)).length; }
function unitUnlocked(i){ return i===0 || unitProgress(UNITS[i-1])>=CFG.unlockUnitAt; }
function dueCards(){ const now=Date.now(); return allCards().filter(c=>S.cards[c.key]?.seen && S.cards[c.key].due<=now); }
function level(){ return Math.floor(S.xp/100)+1; }

function tick(){ // decaimiento de la panza y cambio de día
  const h=(Date.now()-S.fullTs)/36e5;
  if(h>0){ S.fullness=Math.max(0,S.fullness-h*CFG.decayPerHour); S.fullTs=Date.now(); }
  if(S.todayKey!==todayKey()){ S.todayKey=todayKey(); S.todayXP=0; }
  if(S.lastGoalDay && S.lastGoalDay!==todayKey() && S.lastGoalDay!==yesterdayKey()) S.streak=0;
}

/* ---------- repetición espaciada (SM-2 simplificado) ---------- */
function review(key, ok){
  const c=card(key); c.seen=true; const DAY=864e5;
  if(ok){ c.reps++; c.interval = c.reps===1?1 : c.reps===2?3 : Math.round(c.interval*c.ease); c.ease=Math.min(3,c.ease+.05); }
  else  { c.reps=0; c.interval=0; c.ease=Math.max(1.3,c.ease-.2); }
  c.due = Date.now() + (ok? c.interval*DAY : 10*60e3);
}

/* =====================================================================
   VOZ (Web Speech API del navegador)
   ===================================================================== */
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

const $=s=>document.querySelector(s);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();

function checkUnlocks(){
  PETS.forEach(p=>{ if(S.unlocked.includes(p.id)) return;
    const ok=(p.req.xp!==undefined && S.xp>=p.req.xp)||(p.req.streak && S.streak>=p.req.streak);
    if(ok){ S.unlocked.push(p.id); toast(`🎉 ¡${p.name} (${p.sp}) se unió a tu madriguera!`); } });

/* =====================================================================
   LECCIÓN — cola de tarjetas, tipos de ejercicio, retroalimentación
   ===================================================================== */
let L=null; // sesión actual
function startLesson(unitId){
  tick();
  const all=allCards(); let queue=[];
  const due=shuffle(dueCards()).slice(0,CFG.sessionSize-CFG.newPerSession);
  queue.push(...due);
  // palabras nuevas: de la unidad elegida, o de la primera desbloqueada con palabras sin ver
  let pool=[];
  if(unitId){ pool=all.filter(c=>c.unit===unitId && !S.cards[c.key]?.seen); }
  if(!pool.length){ for(let i=0;i<UNITS.length;i++){ if(!unitUnlocked(i)) continue; pool=all.filter(c=>c.unit===UNITS[i].id && !S.cards[c.key]?.seen); if(pool.length) break; } }
  queue.push(...pool.slice(0, CFG.sessionSize-queue.length));
  if(queue.length<4){ // práctica libre con lo aprendido (o de la unidad) si no hay nada pendiente
    const seen=shuffle(all.filter(c=>S.cards[c.key]?.seen && !queue.includes(c) && (!unitId||c.unit===unitId)));
    queue.push(...seen.slice(0,CFG.sessionSize-queue.length));
  }
  if(!queue.length) return toast('No hay nada que estudiar todavía.');
  L={queue, i:0, total:queue.length, correct:0, wrong:0, xp:0, seeds:0, answered:new Set(), retry:[]};
  showView('lesson'); nextEx();
}
$('#btnQuit').onclick=()=>{ if(L && L.i>0) finish(true); else showView('home'); };

function exType(c){ // el tipo depende de cuánto conoce la palabra
  const r=S.cards[c.key]?.reps||0, seen=S.cards[c.key]?.seen;
  if(!seen||r===0) return 'en2es';
  if(r===1) return shuffle(['es2en','fill'])[0];
  return shuffle(['fill','listen','type','es2en'])[0];
}
function options(c, field){ // 3 distractores, de preferencia de la misma unidad
  const same=allCards().filter(x=>x.unit===c.unit && x.en!==c.en); const d=shuffle(same).slice(0,3);
  return shuffle([c,...d]).map(x=>x[field]);
}
function nextEx(){
  $('#fb').classList.remove('show','ok','bad');
  if(L.i>=L.queue.length){ return finish(false); }
  const c=L.queue[L.i]; const t=exType(c); L.cur={c,t}; const ex=$('#ex');
  $('#lprog').style.width=(L.i/L.queue.length*100)+'%'; $('#lcount').textContent=`${L.i+1}/${L.queue.length}`;
  const isNew=!S.cards[c.key]?.seen;
  const hint=`<div class="pethint">${PET_SVG[S.pet]()}<span>${isNew?'Palabra nueva: '+petDef(S.pet).name+' la está aprendiendo contigo.':'Repaso'}</span></div>`;
  const opts=(list)=>`<div class="opts">${list.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
  if(t==='en2es') ex.innerHTML=`<div class="q">¿Qué significa?</div><div class="big">${c.en}<button class="spk" data-say="${c.en}">🔊</button></div>${opts(options(c,'es'))}${hint}`;
  if(t==='es2en') ex.innerHTML=`<div class="q">¿Cómo se dice en inglés?</div><div class="big">${c.es}</div>${opts(options(c,'en'))}${hint}`;
  if(t==='fill') ex.innerHTML=`<div class="q">Completa la oración</div><div class="sent">${c.s.replace('___','<u>&nbsp;</u>')}</div>${opts(options(c,'en'))}${hint}`;
  if(t==='listen') ex.innerHTML=`<div class="q">Escucha y elige lo que oíste</div><button class="spk xl" data-say="${c.en}">🔊</button>${opts(options(c,'en'))}${hint}`;
  if(t==='type') ex.innerHTML=`<div class="q">Escribe en inglés</div><div class="big">${c.es}</div><input class="inp" id="inp" autocomplete="off" autocapitalize="off" placeholder="…"><button class="check" id="btnCheck">Comprobar</button>${hint}`;
  ex.querySelectorAll('.spk').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  ex.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.v, b));
  if(t==='listen'){ setTimeout(()=>speak(c.en),300); }
  if(t==='type'){ const i=$('#inp'); i.focus(); $('#btnCheck').onclick=()=>answer(i.value); i.onkeydown=e=>{ if(e.key==='Enter') answer(i.value); }; }
}
function answer(v, btn){
  const {c,t}=L.cur; const field=(t==='en2es')?'es':'en';
  const ok= norm(v)===norm(c[field]);
  const first=!L.answered.has(c.key);
  if(first){ L.answered.add(c.key); review(c.key, ok); }
  document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(norm(b.dataset.v)===norm(c[field])) b.classList.add('ok'); });
  if(btn&&!ok) btn.classList.add('bad');
  const inp=$('#inp'); if(inp){ inp.disabled=true; inp.style.borderColor=ok?'var(--ok)':'var(--bad)'; $('#btnCheck').disabled=true; }
  const fb=$('#fb'); fb.classList.add('show', ok?'ok':'bad');
  if(ok){
    if(first){ L.correct++; L.xp+=CFG.xpCorrect; L.seeds+=CFG.seedCorrect; }
    $('#fbTitle').textContent=['¡Squeak!','¡Exacto!','¡Muy bien!','¡Eso es!'][Math.random()*4|0];
    $('#fbText').innerHTML=`<b style="font-size:16px">${c.en}</b> = ${c.es} · <i>${fullSent(c)}</i>`;
  } else {
    if(first){ L.wrong++; L.retry.push(c); }
    $('#fbTitle').textContent='Casi…';
    $('#fbText').innerHTML=`La respuesta era <b style="font-size:16px">${c[field]}</b> · <i>${fullSent(c)}</i>`;
  }
  if(t!=='en2es') speak(c.en);
  save();
}
$('#btnNext').onclick=()=>{
  L.i++;
  if(L.i>=L.queue.length && L.retry.length){ L.queue.push(...L.retry); L.retry=[]; } // los errores vuelven al final
  nextEx();
};
function finish(early){
  $('#fb').classList.remove('show');
  tick();
  S.xp+=L.xp; S.seeds+=L.seeds; S.todayXP+=L.xp;
  const perfect=!early && L.wrong===0 && L.total>0; if(perfect) S.seeds+=CFG.perfectBonus;
  if(S.todayXP>=CFG.dailyGoal && S.lastGoalDay!==todayKey()){ S.streak=(S.lastGoalDay===yesterdayKey())?S.streak+1:1; S.lastGoalDay=todayKey(); }
  save(); checkUnlocks(); renderTop();
  const p=petDef(S.pet);
  $('#lprog').style.width='100%'; $('#lcount').textContent='';
  $('#ex').innerHTML=`<div class="done">
    <div class="pet-big" data-state="happy">${PET_SVG[p.id]()}</div>
    <h2>${early?'Sesión guardada':perfect?'¡Sesión perfecta!':'¡Sesión terminada!'}</h2>
    <p style="color:var(--ink2);font-weight:700">${p.name} ${perfect?'está dando saltos.':'aprendió contigo.'}</p>
    <div class="rew"><div><b>+${L.xp}</b>XP</div><div><b>+${L.seeds+(perfect?CFG.perfectBonus:0)}</b>🌰 semillas</div><div><b>${L.correct}/${L.correct+L.wrong}</b>aciertos</div></div>
    ${perfect?`<p style="font-weight:800;color:var(--terra2)">Bono por sesión perfecta: +${CFG.perfectBonus} 🌰</p>`:''}
    <button class="cta" id="btnHome" style="margin-top:14px">Volver a la madriguera</button>
    <button class="cta" id="btnAgain" style="margin-top:10px;background:var(--terra);box-shadow:0 5px 0 var(--terra2)">Otra ronda</button>
  </div>`;
  $('#btnHome').onclick=()=>showView('home'); $('#btnAgain').onclick=()=>startLesson();
  L=null;
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
load(); tick(); checkUnlocks(); renderTop(); showView('home');
</script>
</body>
</html>
